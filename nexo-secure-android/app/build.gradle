plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.nexosecure.demo'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.nexosecure.alpha'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.0.0-alpha1'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
