plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.nexosecure.demo'
    compileSdk 35

    defaultConfig {
        // Identificador nuevo para evitar conflictos de firma con instalaciones anteriores.
        applicationId 'cl.nexosecure.compat.v03'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3-compat-test'
    }

    buildTypes {
        debug {
            // La compilación debug queda firmada automáticamente por Gradle.
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
