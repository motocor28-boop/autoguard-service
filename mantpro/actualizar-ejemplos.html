<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12171c">
  <title>Actualizar ejemplos EECR</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12171c;color:#f4f7f9;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}.card{width:min(480px,100%);background:#1d2830;border:1px solid #496170;border-radius:22px;padding:28px;box-shadow:0 20px 70px #0008}.eyebrow{color:#ff8b18;font-weight:900;letter-spacing:.08em}.bar{height:12px;background:#0e151a;border-radius:999px;overflow:hidden;margin:22px 0}.bar span{display:block;height:100%;width:18%;background:#ff8b18;border-radius:inherit;animation:load 2.2s ease-in-out forwards}@keyframes load{to{width:100%}}h1{font-size:28px;line-height:1.15}p{color:#c8d2d8;line-height:1.5}.status{font-weight:800;color:#fff}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">SISTEMA DE SUPERVISIÓN REMOTO EECR</div>
    <h1>Actualizando y cargando 6 ejemplos</h1>
    <p>Se renovará la caché técnica. Sus registros reales, fotografías, sesión y configuración no se eliminan.</p>
    <div class="bar"><span></span></div>
    <div id="status" class="status">Preparando actualización…</div>
  </main>
  <script>
  (async()=>{
    const STORE='mantpro-records-v3',status=document.getElementById('status');
    const parse=()=>{try{const v=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(v)?v:[]}catch{return[]}};
    const now=new Date(),iso=(h,m=0)=>new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0,0).toISOString(),day=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
    const photo=(id,url,designation,segment,time,description)=>({id,dataUrl:url,src:url,designation,segment,capturedAt:time,description,note:description,demo:true});
    const p={
      before:'https://images.pexels.com/photos/10290629/pexels-photo-10290629.jpeg?auto=compress&cs=tinysrgb&w=900',
      during:'https://images.pexels.com/photos/37340066/pexels-photo-37340066/free-photo-of-technician-repairing-machinery-in-workshop.jpeg?auto=compress&cs=tinysrgb&w=900',
      deviation:'https://images.pexels.com/photos/8985965/pexels-photo-8985965.jpeg?auto=compress&cs=tinysrgb&w=900',
      walk:'https://images.pexels.com/photos/16045333/pexels-photo-16045333.jpeg?auto=compress&cs=tinysrgb&w=900',
      immediate:'https://images.pexels.com/photos/32208781/pexels-photo-32208781/free-photo-of-technician-repairing-industrial-machine-equipment.jpeg?auto=compress&cs=tinysrgb&w=900',
      kpi:'https://images.pexels.com/photos/36727265/pexels-photo-36727265.jpeg?auto=compress&cs=tinysrgb&w=900'
    };
    const job='eecr-demo-job-001',walk='eecr-demo-walk-001',updatedAt=new Date().toISOString();
    const examples=[
      {id:job,type:'job',title:'EECR-DEMO-OT-001 · Bomba P-101',at:iso(8),updatedAt,dirty:true,synced:false,data:{demo:true,folio:'EECR-DEMO-OT-001',plant:'Planta de Procesos — Demostración',area:'Sala de bombas',equip:'Bomba centrífuga P-101',task:'Inspección y corrección de fuga en conjunto de bombeo',maintenance:'Correctiva',priority:'Alta',plannedStart:iso(8),plannedEnd:iso(12),actualStart:iso(8,15),actualEnd:iso(11,50),docsStart:iso(7,55),docsEnd:iso(8,5),lotoStart:iso(8,5),zeroVerifiedAt:iso(8,12),lotoEnd:iso(11,42),progress:100,pauses:[],technicians:'Técnico demostración',stagePhotos:[photo('eecr-demo-photo-01',p.before,'Antes del trabajo','Trabajo',iso(8,10),'Vista general del equipo y de la sala de bombas antes de iniciar la intervención.')]}},
      {id:'eecr-demo-progress-001',type:'progress',title:'65% · Inspección mecánica y corrección',at:iso(9,35),updatedAt,dirty:true,synced:false,data:{demo:true,jobId:job,recordedAt:iso(9,35),percent:65,text:'Se retiraron las protecciones, se inspeccionó el acoplamiento y se corrigió la condición observada.',findings:'Se detectó desgaste superficial y pérdida menor de estanqueidad, sin daño estructural visible.',photoType:'Durante el trabajo',stagePhotos:[photo('eecr-demo-photo-02',p.during,'Durante el trabajo','Trabajo',iso(9,35),'Técnico realizando la inspección y ajuste del conjunto durante la intervención.')]}},
      {id:'eecr-demo-safety-001',type:'safety',title:'Condición insegura · Sala de bombas',at:iso(8,25),updatedAt,dirty:true,synced:false,data:{demo:true,jobId:job,origin:'Trabajo',recordedAt:iso(8,25),plant:'Planta de Procesos — Demostración',area:'Sala de bombas',category:'Condición insegura',risk:'Medio',text:'Se observó presencia de aceite en el sector próximo al equipo, generando riesgo de resbalamiento.',action:'Se delimitó el sector, se instaló material absorbente y se limpió la superficie.',recommendation:'Verificar estanqueidad y mantener control visual posterior a la puesta en servicio.',responsible:'Supervisor EECR',dueDate:day,closedAt:iso(11,30),stagePhotos:[photo('eecr-demo-photo-03',p.deviation,'Desviación o hallazgo detectado','Desviación',iso(8,25),'Condición inicial del equipo y sus conexiones al detectar la desviación.')]}},
      {id:walk,type:'walk',title:'Caminata · Área de equipos rotatorios',at:iso(10),updatedAt,dirty:true,synced:false,data:{demo:true,startAt:iso(10),endAt:iso(10,35),plant:'Planta de Procesos — Demostración',area:'Equipos rotatorios y tableros',objective:'Verificar condiciones operacionales, orden, limpieza y controles de seguridad.',participants:'Esteban Cortez Richards, Técnico demostración',stagePhotos:[photo('eecr-demo-photo-04',p.walk,'Vista general de la caminata','Caminata',iso(10,5),'Vista general del sector recorrido durante la caminata de seguridad.')]}},
      {id:'eecr-demo-walk-safety-001',type:'safety',title:'Orden y aseo · Sector de mantenimiento',at:iso(10,18),updatedAt,dirty:true,synced:false,data:{demo:true,walkId:walk,origin:'Caminata',recordedAt:iso(10,18),plant:'Planta de Procesos — Demostración',area:'Sector de mantenimiento',category:'Orden y aseo',risk:'Bajo',text:'Se identificaron herramientas y elementos de trabajo fuera de su ubicación definida.',action:'Los elementos fueron ordenados y el área quedó despejada.',recommendation:'Mantener el estándar de orden al término de cada actividad.',responsible:'Técnico demostración',dueDate:day,closedAt:iso(10,30),stagePhotos:[photo('eecr-demo-photo-05',p.immediate,'Medida inmediata aplicada','Caminata',iso(10,25),'Ejecución de la medida inmediata y revisión del sector antes del cierre.')]}},
      {id:'eecr-demo-kpi-001',type:'kpi',title:'Técnico demostración · 94%',at:iso(11,55),updatedAt,dirty:true,synced:false,data:{demo:true,jobId:job,recordedAt:iso(11,55),technician:'Técnico demostración',safety:5,quality:5,compliance:5,productivity:4,documentation:4,communication:5,score:94,firstTimeRight:true,rework:false,externalFactors:false,notes:'El técnico cumplió los controles de seguridad y dejó evidencia del trabajo ejecutado.',training:'Reforzar registro de mediciones y condición final.',stagePhotos:[photo('eecr-demo-photo-06',p.kpi,'Evidencia de desempeño','KPI',iso(11,45),'Área de trabajo organizada al término de la actividad.')]} }
    ];
    try{
      status.textContent='Insertando seis registros demostrativos…';
      const map=new Map(parse().map(x=>[x.id,x]));examples.forEach(x=>map.set(x.id,x));localStorage.setItem(STORE,JSON.stringify([...map.values()]));
      localStorage.setItem('eecr-demo-six-pending-v2','1');localStorage.setItem('eecr-force-build','20260802-eecrdemo4');
      status.textContent='Eliminando archivos antiguos…';
      if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/mantpro|eecr/i.test(k)).map(k=>caches.delete(k)))}
      if('serviceWorker' in navigator){status.textContent='Renovando aplicación instalada…';const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}
      status.textContent='6 ejemplos guardados. Abriendo Informes…';
      setTimeout(()=>location.replace('./?actualizar=eecrdemo4&ejemplos=6&t='+Date.now()),700);
    }catch(error){
      console.error(error);status.textContent='Los ejemplos fueron preparados. Abriendo la aplicación…';
      setTimeout(()=>location.replace('./?actualizar=eecrdemo4&ejemplos=6&t='+Date.now()),900);
    }
  })();
  </script>
</body>
</html>
