<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12171c">
  <title>Actualizar ejemplos EECR</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12171c;color:#f4f7f9;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}.card{width:min(480px,100%);background:#1d2830;border:1px solid #496170;border-radius:22px;padding:28px;box-shadow:0 20px 70px #0008}.eyebrow{color:#ff8b18;font-weight:900;letter-spacing:.08em}.bar{height:12px;background:#0e151a;border-radius:999px;overflow:hidden;margin:22px 0}.bar span{display:block;height:100%;width:18%;background:#ff8b18;border-radius:inherit;animation:load 2.2s ease-in-out forwards}@keyframes load{to{width:100%}}h1{font-size:28px;line-height:1.15}p{color:#c8d2d8;line-height:1.5}.status{font-weight:800;color:#fff}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">SISTEMA DE SUPERVISIÓN REMOTO EECR</div>
    <h1>Actualizando y cargando 6 ejemplos</h1>
    <p>Se renovará la caché técnica. Sus registros reales, fotografías, sesión y configuración no se eliminan.</p>
    <div class="bar"><span></span></div>
    <div id="status" class="status">Preparando actualización…</div>
  </main>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    try{
      localStorage.setItem('eecr-demo-six-pending-v2','1');
      localStorage.setItem('eecr-force-build','20260802-eecrdemo4');
      status.textContent='Eliminando archivos antiguos…';
      if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/mantpro|eecr/i.test(k)).map(k=>caches.delete(k)))}
      status.textContent='Renovando aplicación instalada…';
      if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}
      status.textContent='Abriendo la versión corregida…';
      setTimeout(()=>location.replace('./?actualizar=eecrdemo4&ejemplos=6&t='+Date.now()),500);
    }catch(error){
      console.error(error);
      status.textContent='Abriendo la aplicación para completar la actualización…';
      setTimeout(()=>location.replace('./?actualizar=eecrdemo4&ejemplos=6&t='+Date.now()),800);
    }
  })();
  </script>
</body>
</html>
