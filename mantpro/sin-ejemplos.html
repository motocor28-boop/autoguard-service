<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12171c">
  <title>Restaurar versión sin ejemplos</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12171c;color:#f4f7f9;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}.card{width:min(480px,100%);background:#1d2830;border:1px solid #496170;border-radius:22px;padding:28px;box-shadow:0 20px 70px #0008}.eyebrow{color:#ff8b18;font-weight:900;letter-spacing:.08em}.bar{height:12px;background:#0e151a;border-radius:999px;overflow:hidden;margin:22px 0}.bar span{display:block;height:100%;width:18%;background:#ff8b18;border-radius:inherit;animation:load 2s ease-in-out forwards}@keyframes load{to{width:100%}}h1{font-size:28px;line-height:1.15}p{color:#c8d2d8;line-height:1.5}.status{font-weight:800;color:#fff}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">SISTEMA DE SUPERVISIÓN REMOTO EECR</div>
    <h1>Restaurando versión sin ejemplos</h1>
    <p>Se eliminarán únicamente los registros EECR-DEMO y la caché técnica. Sus registros reales, fotografías, sesión y configuración se conservarán.</p>
    <div class="bar"><span></span></div>
    <div id="status" class="status">Preparando limpieza…</div>
  </main>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    const ids=new Set(['eecr-demo-job-001','eecr-demo-progress-001','eecr-demo-safety-001','eecr-demo-walk-001','eecr-demo-walk-safety-001','eecr-demo-kpi-001']);
    const demo=x=>x&&(ids.has(x.id)||/^eecr-demo-/i.test(String(x.id||''))||/^EECR-DEMO-/i.test(String(x.data&&x.data.folio||'')));
    const clean=key=>{try{const rows=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(rows))localStorage.setItem(key,JSON.stringify(rows.filter(x=>!demo(x))))}catch{}};
    try{
      status.textContent='Eliminando registros demostrativos…';
      clean('mantpro-records-v3');clean('mantpro-records');
      ['eecr-demo-six-pending-v2','eecr-force-build','eecr-demo-six-pending','eecr-demo-loaded'].forEach(key=>localStorage.removeItem(key));
      localStorage.setItem('eecr-no-demo-cleanup-pending','1');
      status.textContent='Eliminando archivos técnicos antiguos…';
      if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(key=>/mantpro|eecr/i.test(key)).map(key=>caches.delete(key)))}
      status.textContent='Renovando la aplicación instalada…';
      if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(reg=>reg.unregister()))}
      status.textContent='Versión limpia preparada. Abriendo aplicación…';
      setTimeout(()=>location.replace('./?actualizar=sin-ejemplos&t='+Date.now()),500);
    }catch(error){
      console.error(error);status.textContent='Abriendo la aplicación para completar la limpieza…';
      setTimeout(()=>location.replace('./?actualizar=sin-ejemplos&t='+Date.now()),800);
    }
  })();
  </script>
</body>
</html>
