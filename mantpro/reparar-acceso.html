<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reparar acceso MANTPRO</title>
<style>body{font-family:Arial,sans-serif;background:#12171c;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:560px;padding:28px;border-radius:18px;background:#1e2832}h1{margin-top:0}.ok{color:#9fe3b1}.muted{color:#bac6d1}</style>
</head>
<body>
<div class="box"><h1>Reparando acceso MANTPRO</h1><p id="msg" class="muted">Eliminando caché de acceso anterior…</p></div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    localStorage.removeItem('mantpro-cloud-session-v2');
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('eecr-supervision-')).map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>(r.active?.scriptURL||r.waiting?.scriptURL||r.installing?.scriptURL||'').includes('/mantpro/')).map(r=>r.unregister()));
    }
    msg.className='ok';
    msg.textContent='Acceso reparado. Abriendo MANTPRO sin contraseña…';
    setTimeout(()=>location.replace('./?repair=20260921-open-access-v4&ts='+Date.now()),800);
  }catch(err){
    msg.textContent='La limpieza automática no terminó: '+err.message+' . Recargando MANTPRO…';
    setTimeout(()=>location.replace('./?repair=20260921-open-access-v4&ts='+Date.now()),1200);
  }
})();
</script>
</body>
</html>
